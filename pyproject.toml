[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11","numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-gr"
version = "0.1.0"
description = "High-throughput serving plugin for generative recommendation models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "vLLM-Gr Team"}
]
keywords = ["vllm", "recommendation", "inference", "hstu", "generative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "vllm==0.14.*",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "pyarrow>=23.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "tblib",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "psutil"
]

[project.scripts]
vllm = "vllm_gr.entrypoints.cli.main:main"
vllm-gr = "vllm_gr.entrypoints.cli.main:main"

[tool.setuptools]
packages = ["vllm_gr"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
